name: Build and validate plugin

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test operator list pagination
    runs-on: ubuntu-24.04
    steps:
      - name: Check out OpList source
        uses: actions/checkout@v7.0.1
      - name: Run pagination cases
        run: php tests/pagination.php

  build:
    needs: test
    uses: NhanAZ/DevTools/.github/workflows/build-plugin.yml@6606444fc32787a3e50275fdb668c2310e899740
    with:
      axolotl-ref: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955
      phpstan: max
